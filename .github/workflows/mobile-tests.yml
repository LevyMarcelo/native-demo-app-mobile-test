
name: Mobile Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    name: Android Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APPIUM_HOST: 127.0.0.1
      APPIUM_PORT: 4723
      ANDROID_DEVICE_NAME: emulator-5554
      ANDROID_APP_PACKAGE: com.wdiodemoapp
      ANDROID_APP_ACTIVITY: com.wdiodemoapp.MainActivity
      ANDROID_API_LEVEL: '35'
      APPIUM_VERSION: '3.9.0'
      UIAUTOMATOR2_VERSION: '8.7.3'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies
        run: npm ci

      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium@3.9.0
          appium driver install uiautomator2@8.7.3
          appium driver list --installed

      - name: Download native-demo-app APK
        run: |
          mkdir -p apps

          APK_URL="https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk"

          curl -fL "$APK_URL" -o apps/native-demo-app.apk

          ls -lh apps/native-demo-app.apk

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -memory 4096
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            echo "Checking Android emulator..."
            adb devices -l

            echo "Installing native-demo-app..."
            adb install -r apps/native-demo-app.apk

            echo "Starting Appium server..."
            appium --address 127.0.0.1 --port 4723 --log-level info > appium.log 2>&1 &

            echo "Waiting for Appium server..."
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:4723/status > /dev/null

            echo "Appium server is ready."

            echo "Running Android automated tests..."
            npm run test:android

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ] && \
             find allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            npm run report:generate
          else
            echo "No Allure test results available."
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-test-artifacts
          path: |
            allure-results/
            allure-report/
            appium.log
          if-no-files-found: warn
          retention-days: 14
